# 01-deployment-backend.yaml
# 后端 Deployment（无状态，replicas 可调，HPA 友好）
# 占位符：${NAMESPACE}, ${OCI_REGISTRY}, ${IMAGE_VERSION}
# 依赖：06-configmap.yaml 的 z-script-config + z-script-db-credentials Secret（由 bin/k8s-apply.sh 现场创建）

apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-script-backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: z-script
    app.kubernetes.io/component: backend
    z.opc.io/layer: L3
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: z-script
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-script
        app.kubernetes.io/component: backend
        z.opc.io/layer: L3
    spec:
      serviceAccountName: z-script
      containers:
        - name: z-script
          image: ${OCI_REGISTRY}/z-script-admin:${IMAGE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
            # z.base.db.script.* 由 ModuleDataSourceTemplate 读取；
            # host/port/database 走 ConfigMap，密码走 Secret（凭证不入 Git）。
            - name: Z_BASE_DB_SCRIPT_HOST
              valueFrom:
                configMapKeyRef:
                  name: z-script-config
                  key: db.host
            - name: Z_BASE_DB_SCRIPT_PORT
              valueFrom:
                configMapKeyRef:
                  name: z-script-config
                  key: db.port
            - name: Z_BASE_DB_SCRIPT_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: z-script-config
                  key: db.database
            - name: Z_BASE_DB_SCRIPT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: z-script-db-credentials
                  key: username
            - name: Z_BASE_DB_SCRIPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-script-db-credentials
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /script/actuator/health/liveness
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /script/actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 5
---
# 数据库凭证 Secret（部署前手动 kubectl apply）
# kubectl -n ${NAMESPACE} create secret generic z-script-db-credentials \
#     --from-literal=password='YOUR_DB_PASSWORD'
# 此处不直接定义 Secret 内容（避免凭证入 Git）