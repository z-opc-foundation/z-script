# Mode 2：分体部署（前端 nginx + 后端 jar，两个容器）
# 适用：前端频繁迭代 / 前端团队独立 / 需要 CDN 缓存前端
#
# 启动：cd deploy && docker compose -f docker-compose.split.yml --profile with-db up -d
#       （已有外部库时去掉 --profile with-db，并用 Z_BASE_DB_SCRIPT_* 指向它）
# 访问：http://localhost/script/
# 停止：docker compose -f docker-compose.split.yml --profile with-db down

services:
  z-script-backend:
    container_name: z-script-backend
    image: ghcr.io/yuku123/z-script-admin:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        JAR_FILE: z-script-admin/target/z-script-admin-1.0.0-exec.jar
    restart: unless-stopped
    expose:
      - "8086"
    # 不映射 8086 到 host（仅 internal network 访问）
    environment:
      Z_BASE_DB_SCRIPT_HOST: ${Z_BASE_DB_SCRIPT_HOST:-z-script-mysql}
      Z_BASE_DB_SCRIPT_PORT: ${Z_BASE_DB_SCRIPT_PORT:-3306}
      Z_BASE_DB_SCRIPT_DATABASE: ${Z_BASE_DB_SCRIPT_DATABASE:-z_script}
      Z_BASE_DB_SCRIPT_USERNAME: ${Z_BASE_DB_SCRIPT_USERNAME:-root}
      Z_BASE_DB_SCRIPT_PASSWORD: ${Z_BASE_DB_SCRIPT_PASSWORD:-}
      JAVA_OPTS: "-Xms512m -Xmx1g"
    networks:
      - z-script-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/script/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  z-script-suit:
    container_name: z-script-suit
    image: ghcr.io/yuku123/z-script-suit:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # nginx.conf.template 里的 ${BACKEND_SERVICE} 通过这里注入
      BACKEND_SERVICE: z-script-backend
    networks:
      - z-script-net
    depends_on:
      z-script-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 可选：--profile with-db 时一起起库，首次自动跑 init.sql
  z-script-mysql:
    profiles: ["with-db"]
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      # 与后端共用同一个变量，避免出现"库起来了但密码对不上"
      MYSQL_ROOT_PASSWORD: ${Z_BASE_DB_SCRIPT_PASSWORD:-}
      MYSQL_DATABASE: z_script
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - z-script-mysql-data:/var/lib/mysql
      - ../_doc/002_deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - z-script-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  z-script-net:
    driver: bridge

volumes:
  z-script-mysql-data:

# 验证步骤：
# 1. docker compose -f docker-compose.split.yml --profile with-db ps（三个容器都 healthy）
# 2. 访问：http://localhost/script/（前端 SPA，点「签发 AK」后拉列表）
# 3. 验证前端能反代到后端：curl -i http://localhost/script/api/script/list（无 Key 应 401）
# 4. 验证后端独立可访问：docker exec -it z-script-backend wget -qO- http://127.0.0.1:8086/script/actuator/health